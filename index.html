  editing=true;const nm=ids=>ids.map(id=>{const t=TOPICS.find(x=>x.id===id);return t.num+" "+t.name}).join(", ");
  const a=Object.keys(E).map(k=>{const c=CARDS.find(x=>x.k===k);return c?`[${c.tn}] ${E[k].t}${E[k].t!==c.t?" (vorher: "+c.t+")":""}\n${E[k].d}`:""}).filter(Boolean);
  const b=U.map(u=>`[Eigene Karte · ${nm(u.tids)}] ${u.t}\n${u.d}`);
  const txt=a.concat(b).join("\n\n");
  $("stage").innerHTML=`<div class="edit"><div class="tag">Geänderte und eigene Karten – zum Übernehmen in die Liste an Claude geben</div><textarea id="eO" readonly style="min-height:200px"></textarea><div class="row"><button class="neutral" id="oX">Schließen</button><button class="ok" id="oC">Kopieren</button></div></div>`;
  const ta=$("eO");ta.value=txt;$("bNo").disabled=$("bOk").disabled=true;$("oX").onclick=closeForm;
  $("oC").onclick=()=>{ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}try{navigator.clipboard.writeText(txt)}catch(e){}$("oC").textContent=ok?"Kopiert ✓":"Text markiert – bitte kopieren"}}
function next(){isChk=false;cur=(idle()&&S.cel!==S.topic)?null:pick();shown=false;render()}
function reveal(){if(cur!=null&&!shown&&!editing){shown=true;render()}}
function rate(ok){
  if(!shown||cur==null||editing)return;const c=st(cur);c.s=1;S.t++;c.l=S.t;S.ts=Date.now();
  if(ok){c.n=0;
    if(c.b>=LAST)c.d=S.t+gapR(LAST);
    else if(c.b===3){ if(c.ss<S.sess){c.b=LAST;c.d=S.t+gapR(LAST)} else {c.w=1;c.d=1e9} } // 4. „Sitzt“ zählt nur in einer späteren Sitzung als das 3.
    else{c.b++;if(c.b===3)c.ss=S.sess;c.d=S.t+gapR(c.b)}}
  else{c.b=c.b===LAST?2:Math.max(0,c.b-1);c.w=0;c.n=(c.n||0)+1;c.d=S.t+2+Math.min(c.n,2)}
  S.last=CARDS[cur].k;if(!idle())S.cel=null;save();next()}
$("topic").onchange=e=>{S.topic=e.target.value;S.last=null;save();next()};
$("bDir").onclick=()=>{S.rev=!S.rev;shown=false;save();render()};
$("bOk").onclick=()=>rate(true);$("bNo").onclick=()=>rate(false);
$("bNew").onclick=()=>form("new");$("bExp").onclick=exportEdits;
$("bReset").onclick=()=>{const all=S.topic==="all",nm=all?"ALLE Themen":TOPICS.find(t=>t.id===S.topic).name;
  if(confirm(`Lernfortschritt für „${nm}“ zurücksetzen?`)){scope().forEach(i=>{delete S.c[CARDS[i].k]});S.cel=null;S.last=null;S.chk=[];save();next()}};
document.addEventListener("keydown",e=>{if(editing||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();reveal()}
  else if(e.key==="ArrowLeft"||e.key==="1")rate(false);else if(e.key==="ArrowRight"||e.key==="2")rate(true)});
function startSession(){
  const now=Date.now();if(S.sess&&S.ts&&now-S.ts<SESS_MS)return;
  S.sess=(S.sess||0)+1;const pend=[];
  for(const k in S.c){const c=S.c[k];if(c.w){pend.push(k);c.w=0;c.d=S.t}} // wartende Karten sind jetzt wieder dran
  const pool=scope().filter(i=>st(i).s&&st(i).b>=1);
  pool.sort((a,b)=>(pend.includes(CARDS[b].k)-pend.includes(CARDS[a].k))||st(b).b-st(a).b||st(a).l-st(b).l||st(a).r-st(b).r);
  const n=3+Math.floor(Math.random()*6),ch=pool.slice(0,n).map(i=>CARDS[i].k);
  for(let i=ch.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ch[i],ch[j]]=[ch[j],ch[i]]}
  S.chk=ch;S.ts=now;save()}
build();S=load();if(!TOPICS.some(t=>t.id===S.topic)&&S.topic!=="all")S.topic=TOPICS[0].id;startSession();next();
</script>
