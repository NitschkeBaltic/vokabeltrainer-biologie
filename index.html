<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a22;--mut:#6b7a70;--line:#dde3dc;--red:#C0392B;--yel:#B7860B;--grn:#2F7D4F;--blu:#1F6FB0;--pur:#7B3F8C;--acc:var(--grn);--no:var(--red);--f1:var(--yel);--f2:var(--red);--f3:var(--blu);--f4:var(--pur);--f5:var(--grn);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2620;--ink:#e8efe9;--mut:#93a398;--line:#2d3a31}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d2620;--ink:#e8efe9;--mut:#93a398;--line:#2d3a31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.85rem;margin-bottom:14px}
#sub{min-height:1.2em;margin-bottom:10px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:.72rem;color:var(--mut)}
.box b{display:block;font-size:1.2rem;color:var(--ink)}
.box.cur{outline:2px solid var(--acc)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s,background .3s}
.lg{width:1.2em;height:1.2em;vertical-align:-.25em;margin-right:3px}.lgb{width:34px;height:34px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:230px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tag{font-size:.75rem;color:var(--mut);margin-bottom:10px}
.term{font-size:1.6rem;font-weight:700;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.def{font-size:1.1rem;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);width:100%}
.hint{color:var(--mut);font-size:.85rem;margin-top:16px}
.row{display:flex;gap:10px;margin-top:14px}
button{font:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer;flex:1;font-weight:600;color:#fff}
.no{background:var(--no)}.ok{background:var(--acc)}.neutral{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:.85rem;padding:9px}
button:disabled{opacity:.35;cursor:default}
.foot{display:flex;gap:8px;margin-top:18px}
.done{text-align:center;padding:10px}
.dir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;padding:10px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:.9rem;font-weight:600}
.dir span{color:var(--acc)}
.term.q{font-size:1.2rem;font-weight:600}
.done h2{margin:6px 0}

.top{display:flex;gap:8px;margin:0 0 12px}
select{flex:1;min-width:0;font:inherit;font-size:.9rem;font-weight:600;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.top .dir{width:auto;flex:0 0 auto;margin:0;white-space:nowrap}
.def{white-space:pre-line}
.erg{display:block;font-size:.55rem;color:var(--mut);margin-top:6px;font-weight:400}
.dir span{display:none}
.card{position:relative}
.ed{position:absolute;top:6px;right:8px;flex:none;width:auto;background:none;border:0;color:var(--mut);opacity:.3;font-size:.95rem;padding:4px 7px;font-weight:400}
.ed:hover,.ed:focus{opacity:.9}
.edit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.edit label{display:block;font-size:.75rem;color:var(--mut);margin:8px 0 3px}
.edit input,.edit textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.edit textarea{min-height:110px;resize:vertical}
.lnk{flex:none;width:auto;background:none;border:0;color:var(--mut);font-size:.75rem;font-weight:400;padding:9px 4px;text-decoration:underline}

.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.edit .chk label{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--ink);margin:0}
.edit .chk input{width:auto}
.foot{flex-wrap:wrap;align-items:center}
.note{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--mut);margin:0 0 10px}
.note[hidden]{display:none}
.note.warn{color:var(--no)}
.note button{flex:none;width:auto;background:none;border:0;color:var(--mut);padding:2px 8px;font-weight:400}
.mini{font-size:.78rem;color:var(--mut);margin:6px 0}
.armed{background:var(--no)!important;color:#fff!important;border-color:var(--no)!important}
.beta{font-size:.6rem;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:middle}
.edit label.fbtn{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;cursor:pointer;font-size:.9rem;color:var(--ink)}
.edit .fbtn input{position:absolute;opacity:0;width:0;height:0}
.irow{margin:8px 0}.irow2{display:flex;gap:8px}
.edit .irow2 .in{width:auto;min-width:0;padding:8px;flex:1}
.edit .irow2 .in:first-child{flex:0 0 4.5rem}
.edit .chk.col label{flex:1 1 100%}
a.dl{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;color:var(--ink);font-size:.85rem;text-decoration:none;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:18px;font-size:.7rem;color:var(--mut);opacity:.7}
.tools .armed{text-decoration:none;border-radius:8px;padding:6px 10px}
.mot .neutral{font-size:.85rem;padding:10px 6px}.nw{white-space:nowrap}
#motP{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:.82rem}

    qz={mode:"run",q,i:0,ok:0,miss:0,sh:false};qzR()}}
function qzRate(ok){const z=qz;if(!z||z.mode!=="run"||!z.sh)return;
  if(ok)z.ok++;else{const c=st(z.q[z.i]);if(c.b===LAST){c.b=3;c.w=0;c.n=(c.n||0)+1;c.d=S.t+2+Math.min(c.n,2);save()}z.miss++} // nicht gewusst → zurück in Fach 4
  z.i++;z.sh=false;qzR()}
function qzR(){const z=qz,S_=$("stage");
  if(z.i>=z.q.length){M.lq=dk();M.nq=0;mSave();logRes(z);$("bNo").disabled=$("bOk").disabled=true;
    S_.innerHTML=`<div class="card" style="cursor:default"><div class="done"><div style="font-size:2.5rem">${z.miss?"✅":"🎉"}</div><h2>${z.ok} von ${z.q.length} sitzen</h2><p>${z.miss?`${z.miss} ${z.miss===1?"Karte geht":"Karten gehen"} zurück in Fach 4 und ${z.miss===1?"kommt":"kommen"} bald wieder.`:"Alle Karten bleiben in „Gelernt“."}</p><div class="row"><button class="neutral" id="qX">Zurück zum Lernen</button></div></div></div>`;$("qX").onclick=qDone;return}
  const i=z.q[z.i],T=gT(i),D=gD(i),q=S.rev?D:T,a=S.rev?T:D;
  S_.innerHTML=`<div class="card" id="qC"><div class="tag">Prüfen · ${z.i+1}/${z.q.length}</div><div class="term${S.rev?" q":""}" ${S.rev?'style="white-space:pre-line"':""}>${esc(q)}</div>${z.sh?`<div class="def">${esc(a)}</div>`:`<div class="hint">Tippen zum Aufdecken</div>`}</div><div class="tools"><button class="lnk" id="qEnd">Prüfung beenden</button></div>`;
  $("bNo").disabled=$("bOk").disabled=!z.sh;fitTerm();
  $("qC").onclick=()=>{if(!z.sh){z.sh=true;qzR()}};$("qEnd").onclick=qDone}
document.addEventListener("keydown",e=>{if(!qz||qz.mode!=="run"||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!qz.sh){qz.sh=true;qzR()}}
  else if(e.key==="ArrowLeft"||e.key==="1")qzRate(false);else if(e.key==="ArrowRight"||e.key==="2")qzRate(true)});
let rsArm=false,rsT=null;
function rsOff(){rsArm=false;clearTimeout(rsT);const b=$("bReset");b.textContent="Neu starten";b.classList.remove("armed")}
$("bReset").onclick=()=>{const all=S.topic==="all",nm=all?"ALLE Themen":TOPICS.find(t=>t.id===S.topic).name;
  if(!rsArm){rsArm=true;const b=$("bReset");b.textContent=`„${nm}“ zurücksetzen? Nochmal tippen`;b.classList.add("armed");rsT=setTimeout(rsOff,6000);return}
  rsOff();scope().forEach(i=>{delete S.c[CARDS[i].k]});S.cel=null;S.last=null;S.chk=[];save();next()};
document.addEventListener("keydown",e=>{if(editing||/SELECT|INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();reveal()}
  else if(e.key==="ArrowLeft"||e.key==="1")rate(false);else if(e.key==="ArrowRight"||e.key==="2")rate(true)});
function migrate(){for(const k in S.c){const c=S.c[k];if(c.w){c.w=0;c.b=LAST;c.d=S.t+gapR(LAST)}}} // früher wartende Fach-4-Karten (bereits mit „Sitzt“ bewertet) → „Gelernt“
function startSession(){
  migrate();const now=Date.now();if(S.sess&&S.ts&&now-S.ts<SESS_MS)return;
  S.sess=(S.sess||0)+1;const pend=[];
  for(const k in S.c){const c=S.c[k];if(c.w){pend.push(k);c.w=0;c.d=S.t}} // wartende Karten sind jetzt wieder dran
  S.cq=2;S.chk=[];S.ts=now;save()} // Einstiegs-Check: höchstens 2 zufällige Karten (die zweite nur nach „Nochmal“)
try{localStorage.setItem("vt_probe","1");localStorage.removeItem("vt_probe")}catch(e){bad=1}
applyOverlay();build();S=load();if(!TOPICS.some(t=>t.id===S.topic)&&S.topic!=="all")S.topic=TOPICS[0].id;startSession();next();
</script>
